<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tereas Tareas</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
      

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  
    <link rel="icon" href="./assets/favicon.png" type="image/png">

</head>

<body>

    <div class="contenedor">
        <h1 class="titulo">Lista de Tareas :></h1>

        <p class="mensaje" id="mensaje">Escribe tu tarea pa que no se te olvide</p>

        <input
            type="text"
            class="tarea-entrada"
            id = "tareaEntrada"
            placeholder="Estudiar para la clase de..." />

        <div class="contenedor-botones">
            <button class="boton boton-agregar" id="botonAgregar">Crear Tarea</button>
            <button class="boton boton-ocultar" id="botonOcultar">Ocultar Completadas</button>
            <button class="boton boton-eliminar">Eliminar Completadas</button>
        </div>

        <div class="contenedor-conteo">
            <p>Tareas totales: <span class="tareas-totales"></span></p>
            <p>Tareas terminadas: <span class="tareas-terminadas">0</span></p>  
        </div>

        <div class="contenedor-tareas" id="contenedorTareas">
        </div>

    </div>

</body>

</html>
